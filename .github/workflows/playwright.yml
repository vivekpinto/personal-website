name: Playwright E2E Tests
env:
    TEST_ENV: production
    BASE_URL: https://vivekpinto.github.io/personal-website/

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: Smoke Tests

    timeout-minutes: 10

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: test-results/
          retention-days: 30

  regression:
    name: Regression Tests

    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    timeout-minutes: 15

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium


      - name: Clean Allure results
        run: |
          rm -rf allure-results
          mkdir -p allure-results

      - name: Run regression tests
        run: npm run test:e2e

      - name: Verify Allure results
        if: ${{ !cancelled() }}
        run: |
          echo "========================================"
          echo "ALLURE RESULTS AFTER PLAYWRIGHT"
          echo "========================================"

          echo "Result files:"
          find allure-results -maxdepth 1 -type f -print || true

          echo ""
          echo "Total result files:"
          find allure-results -maxdepth 1 -type f | wc -l

          echo ""
          echo "Allure results directory:"
          ls -lah allure-results/

      - name: Verify fresh Playwright results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "=== Fresh result files ==="

          find allure-results -type f -name '*-result.json' -print

          echo ""
          echo "=== Result timestamps ==="

          find allure-results -type f -name '*-result.json' \
            -exec stat -c '%y %n' {} \;
      
      - name: Generate test summary
        if: ${{ !cancelled() }}
        run: npm run generate:test-summary

      - name: Load previous Allure history
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      
      - name: Restore Allure history
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -d "gh-pages/allure-history/history" ]; then
            mkdir -p allure-results/history
            cp -R gh-pages/allure-history/history/. allure-results/history/
          fi
      
      - name: Inspect Allure results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "========================================"
          echo "ALLURE RESULTS"
          echo "========================================"

          echo ""
          echo "Result files:"
          find allure-results -type f -name '*-result.json' -print

          echo ""
          echo "Result file count:"
          find allure-results -type f -name '*-result.json' | wc -l

          echo ""
          echo "Result timestamps:"
          find allure-results -type f -name '*-result.json' -exec stat -c '%y %n' {} \;

          echo ""
          echo "History files:"
          find allure-results/history -type f -print 2>/dev/null || true

      - name: Inspect Allure results before generation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "========================================"
          echo "ALLURE RESULTS BEFORE GENERATION"
          echo "========================================"

          echo ""
          echo "Result files:"
          find allure-results -maxdepth 1 -type f -print

          echo ""
          echo "History files:"
          find allure-results/history -type f -print 2>/dev/null || true

          echo ""
          echo "Total result files:"
          find allure-results -maxdepth 1 -type f | wc -l

          echo ""
          echo "Result file timestamps:"
          stat allure-results/*-result.json 2>/dev/null || true

          echo ""
          echo "Result file contents:"
          for file in allure-results/*-result.json; do
            echo "----------------------------------------"
            echo "$file"
            cat "$file"
          done    

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          echo "Generating Allure report..."
          npm run report:allure

          echo ""
          echo "=== Generated Allure report ==="
          ls -lah allure-report/

          echo ""
          echo "=== Generated data ==="
          find allure-report/data -maxdepth 2 -type f -print
      
      - name: Add test summary to Allure report
        if: ${{ !cancelled() }}
        run: |
          cp test-results/test-summary.json allure-report/test-summary.json

          echo "Files being published:"
          ls -la allure-report/

          echo "Allure report generated at:"
          date -u

          echo "Allure report index:"
          ls -la allure-report/index.html

          echo "Allure history:"
          ls -la allure-report/history/ || true

      - name: Verify generated Allure report
        run: |
          echo "=== Generated index.html UUID ==="
          grep "allure-report-uuid" allure-report/index.html

          echo ""
          echo "=== Generated JS assets ==="
          find allure-report/assets -maxdepth 1 -type f -name "*.js" -print

          echo ""
          echo "=== Generated report files ==="
          find allure-report -type f | wc -l    

      - name: Publish Allure history
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: allure-history
          keep_files: false
          force_orphan: false

      - name: Verify gh-pages report
        run: |
          git clone --depth 1 --branch gh-pages \
            https://github.com/${{ github.repository }}.git gh-pages-check

          echo "=== Published index.html UUID ==="
          grep "allure-report-uuid" \
            gh-pages-check/allure-history/index.html

          echo ""
          echo "=== Published JS assets ==="
          find gh-pages-check/allure-history/assets \
            -maxdepth 1 -type f -name "*.js" -print

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-results
          path: test-results/
          retention-days: 30