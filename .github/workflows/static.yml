# Deploy portfolio + Allure report to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout portfolio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Checkout Allure report from gh-pages
      - name: Checkout Allure report
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: allure-source

      # 3. Copy Allure report into portfolio
      - name: Add Allure report
        run: |
          mkdir -p test-report

          if [ -d "allure-source/allure-history" ]; then
            cp -R allure-source/allure-history/. test-report/
          else
            echo "Allure report not found."
            exit 1
          fi

      # 4. Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Upload complete site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 6. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5